name: Player identity adapter

on:
  pull_request:
    paths:
      - "experiments/player-identity/**"
      - ".github/workflows/player-identity.yml"
  push:
    branches: [master]
    paths:
      - "experiments/player-identity/**"
      - ".github/workflows/player-identity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run source-only synthetic tests
        run: python3 -m unittest discover -s experiments/player-identity -p 'test_*.py' -v
